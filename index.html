<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Loan Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">

        <h1>
            🚗 Car Eligibility System
        </h1>

        <p>
            Ella - Sales Advisor
        </p>

    </div>


    <div class="container">

        <!-- PANEL KIRI -->

        <div class="left-panel">

            <h2>
                🚗 Semak Kelayakan
            </h2>

            <label>
                Cari Model
            </label>

            <input
                type="text"
                id="search"
                placeholder="Contoh : Saga, Axia, Myvi..."
            >


            <label>
                Gaji Bersih Sebulan
            </label>

            <input
                type="number"
                id="salary"
                placeholder="Contoh : 2500"
            >


            <div id="result">

                <p class="info">
                    Masukkan gaji bersih untuk semak kelayakan.
                </p>

            </div>

        </div>


        <!-- PANEL KANAN -->

        <div class="right-panel">

            <h2>
                💰 Loan Calculator
            </h2>


            <label>
                Model
            </label>

            <select id="family">

                <option value="">
                    Pilih Model
                </option>

            </select>


            <label>
                Variant
            </label>

            <select id="variant">

                <option value="">
                    Pilih Variant
                </option>

            </select>


            <label>
                Harga OTR
            </label>

            <input
                type="text"
                id="price"
                readonly
            >


            <!-- DOWNPAYMENT -->

            <div class="downpayment-label">

                <label>Downpayment</label>

                <select id="downpaymentType">

                    <option value="rm">RM</option>
                    <option value="percent">%</option>

                </select>

            </div>


            <input
                type="number"
                id="downpayment"
                placeholder="Masukkan Downpayment"
                min="0"
            >


            <!-- REBATE -->

            <label>
                Rebate
            </label>

            <input
                type="number"
                id="rebate"
                placeholder="0"
            >


            <!-- SUMMARY -->

            <div class="summary">

                <div class="row">

                    <span>
                        Interest
                    </span>

                    <span id="interest">
                        -
                    </span>

                </div>


                <div class="row">

                    <span>
                        Tempoh
                    </span>

                    <select id="tenure">

                        <option value="9">
                            9 Tahun
                        </option>

                        <option value="8">
                            8 Tahun
                        </option>

                        <option value="7">
                            7 Tahun
                        </option>

                        <option value="6">
                            6 Tahun
                        </option>

                        <option value="5">
                            5 Tahun
                        </option>

                    </select>

                </div>


                <div class="row">

                    <span>
                        Loan Amount
                    </span>

                    <span id="loanAmount">
                        RM0.00
                    </span>

                </div>


                <div class="row total">

                    <span>
                        Monthly
                    </span>

                    <span id="monthly">
                        RM0.00
                    </span>

                </div>

            </div>


            <!-- WHATSAPP -->

            <label>
                No Customer
            </label>

            <input
                type="number"
                id="customerPhone"
                placeholder="60123456789"
            >


            <button
                id="whatsappBtn"
                disabled
                onclick="sendWhatsApp()"
            >
                📲 Hantar Quotation
            </button>


            <button
                onclick="resetCustomer()"
            >
                🔄 Customer Baru
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
